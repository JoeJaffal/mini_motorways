     let x=cell%50,y=Math.floor(cell/50);
     if(x>=x0&&x<x1&&y>=y0&&y<y1){g.fillStyle=kind===1?'#a4c8d9':'#879a85';g.fillRect(x*S,y*S,S,S);}
   }
 }
 g.lineCap='round';g.strokeStyle='#b8b9a5';g.lineWidth=12;
 for(let [cell,bits] of f.connections){let x=cell%50+.5,y=Math.floor(cell/50)+.5;for(let d=0;d<8;d++)if(bits&(1<<d)){g.beginPath();g.moveTo(x*S,y*S);g.lineTo((x+dirs[d][0])*S,(y+dirs[d][1])*S);g.stroke();}}
 if(f.edge){
   let [[x1,y1],[x2,y2]]=f.edge;
   g.strokeStyle='#cc6536';g.lineWidth=8;g.beginPath();
   g.moveTo((x1+.5)*S,(y1+.5)*S);g.lineTo((x2+.5)*S,(y2+.5)*S);g.stroke();
 }
 for(let b of f.buildings){g.fillStyle=colors[b.color%8];g.strokeStyle='white';g.lineWidth=3;let x=b.cell.x*S+3,y=b.cell.y*S+3,w=b.width*S-6,h=b.height*S-6;g.fillRect(x,y,w,h);g.strokeRect(x,y,w,h);g.fillStyle='#263f42';g.font='14px system-ui';g.fillText(b.isHouse?'House':`Destination · demand ${b.demand}`,x,y-5);}
 for(let c of f.cars){g.fillStyle=colors[c.color%8];g.beginPath();g.arc((c.x+.5)*S,(c.y+.5)*S,5,0,Math.PI*2);g.fill();}
 f.focus.forEach((p,i)=>{if(p){g.strokeStyle=i?'#8c38ae':'#176c81';g.lineWidth=4;g.beginPath();g.arc((p[0]+.5)*S,(p[1]+.5)*S,21+i*4,0,Math.PI*2);g.stroke();}});
 seek.value=index;document.getElementById('stats').textContent=`Decision ${index}/${replay.frames.length-1} · ${f.time.toFixed(1)} game seconds · ${f.score} trips`+(f.road_stock===undefined?'':` · ${f.road_stock} road units left`);
 document.getElementById('action').textContent=f.description;
 document.getElementById('ending').textContent=index===replay.frames.length-1?`Ending: ${replay.ending}`:'';
}
function pause(){playing=false;clearTimeout(timer);document.getElementById('play').textContent='Play';}
function tick(){if(!playing)return;if(index>=replay.frames.length-1){pause();return;}let dt=replay.frames[index+1].time-replay.frames[index].time;index++;draw();timer=setTimeout(tick,Math.max(30,(dt>0?1000*dt:150)/Number(document.getElementById('speed').value)));}
document.getElementById('play').onclick=()=>{if(playing)pause();else{playing=true;document.getElementById('play').textContent='Pause';tick();}};
document.getElementById('step').onclick=()=>{pause();index=Math.min(index+1,replay.frames.length-1);draw();};
document.getElementById('restart').onclick=()=>{pause();index=0;draw();};seek.oninput=()=>{pause();index=Number(seek.value);draw();};draw();
</script>
